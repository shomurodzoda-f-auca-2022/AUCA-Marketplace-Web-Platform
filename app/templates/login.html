{% extends "base.html" %}
{% block content %}
<div class="centered-form-wrapper">
    <form method="POST">
        <h2>Login</h2>
        <input type="email" name="email" placeholder="AUCA Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p class="form-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </form>
</div>
{% endblock %}
