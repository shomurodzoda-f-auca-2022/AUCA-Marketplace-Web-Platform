{% extends "base.html" %}
{% block content %}
<div class="centered-form-wrapper">
    <form method="POST">
        <h2>Register</h2>
        <input type="text" name="nickname" placeholder="Your name or nickname" required>
        <input type="email" name="email" placeholder="AUCA Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="phone" placeholder="+996700123456 (required)">
        <button type="submit">Register</button>
        <p class="form-link">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </form>
</div>
{% endblock %}
